<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8c3a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bg)"/>

  <!-- Signal broadcast icon: centered at (100,110), max extent r=80 -->
  <!-- top edge = 30, bottom edge = 190 -> stays safely within 220px canvas -->
  <g transform="translate(100,110)">
    <circle r="80" fill="url(#pulseGlow)"/>
    <circle r="60" fill="none" stroke="#ff6a00" stroke-width="4" opacity="0.35"/>
    <circle r="42" fill="none" stroke="#ff6a00" stroke-width="4" opacity="0.6"/>
    <circle r="24" fill="none" stroke="#ff6a00" stroke-width="4" opacity="0.85"/>
    <circle r="7"  fill="#ff6a00"/>
  </g>

  <!-- Wordmark, vertically centered near icon -->
  <text x="230" y="125" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="60" font-weight="800" fill="#ffffff" letter-spacing="2">RF</text>
  <text x="325" y="125" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="60" font-weight="800" fill="#ff6a00" letter-spacing="1">ROSETTA</text>

  <!-- Tagline -->
  <text x="232" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20" font-style="italic" fill="#9aa4b2">
    Every signal has a story. Now you can read it.
  </text>
</svg>
